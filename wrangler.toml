# Cloudflare Pages configuration for finnoybu.com.
#
# Source of truth for non-secret config. True secrets (BETTER_AUTH_SECRET,
# all *_CLIENT_SECRETs, AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY) live in the
# Cloudflare Pages dashboard:
#   Pages → finnoybu-com → Settings → Variables and Secrets
#
# D1 `finnoybu-com` (uuid b84a5d8b-c080-4d7e-b9f8-c83af3ed6304) is the central
# database for the *.finnoybu.com family. The auth tables
# (user/session/account/verification) are written by the central handler that
# lives here; the reading-data tables (reading_progress / bookmarks /
# annotations / errata_reports / purchases) live in the same D1 and are owned
# by fiction.finnoybu.com and memoirs.finnoybu.com (schema authored in the
# finnoybu-trilogy repo). Cookies are scoped to `.finnoybu.com` so one user
# row spans all three sites.
#
# This DB replaces the legacy `finnoybu-trilogy` D1, which is being retired
# once fiction + memoirs rebind to finnoybu-com.
#
# OAuth Client IDs are public per provider docs — they get embedded in OAuth
# redirect URLs anyway. AWS access keys are treated as a credential pair, so
# both halves stay encrypted in the dashboard.
#
# Cloudflare Pages quirk: once any [env.<name>.*] block exists, Pages treats
# "production" as a named environment that does NOT auto-inherit top-level
# bindings. So [[d1_databases]] is repeated explicitly inside each environment
# block. Top-level declarations stay only as a fallback for `wrangler dev`
# (which DOES inherit them).

name = "finnoybu-com"
compatibility_date = "2026-05-16"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

## Top-level: used by wrangler dev / wrangler d1 commands, NOT by Pages
## production (which reads only from the [env.production] block below).

[[d1_databases]]
binding = "DB"
database_name = "finnoybu-com"
database_id = "b84a5d8b-c080-4d7e-b9f8-c83af3ed6304"

[vars]
AWS_REGION = "us-east-1"
EMAIL_FROM = "Finnoybu.com <hello@finnoybu.com>"

## ═══════════════════════════════════════════════════════════════════════════
## PRODUCTION — finnoybu.com (apex)
## ═══════════════════════════════════════════════════════════════════════════

[[env.production.d1_databases]]
binding = "DB"
database_name = "finnoybu-com"
database_id = "b84a5d8b-c080-4d7e-b9f8-c83af3ed6304"

[env.production.vars]
PUBLIC_SITE_URL = "https://finnoybu.com"
COOKIE_DOMAIN = ".finnoybu.com"
AWS_REGION = "us-east-1"
EMAIL_FROM = "Finnoybu.com <hello@finnoybu.com>"
GOOGLE_CLIENT_ID = "753668982308-i3cvsardb34qcgkqau174uskn4aoqkn5.apps.googleusercontent.com"
FACEBOOK_CLIENT_ID = "4365482573696462"
APPLE_CLIENT_ID = "finnoybu-com"
GITHUB_CLIENT_ID = "Ov23li4nADGWGLvpGzKO"

## ═══════════════════════════════════════════════════════════════════════════
## PREVIEW — per-deploy *.finnoybu-com.pages.dev hashes. PUBLIC_SITE_URL and
## COOKIE_DOMAIN stay empty so src/lib/env's request-origin fallback resolves
## to the per-hash hostname and cookies don't try to attach to .finnoybu.com
## (which a .pages.dev host can't share with anyway).
## ═══════════════════════════════════════════════════════════════════════════

[[env.preview.d1_databases]]
binding = "DB"
database_name = "finnoybu-com"
database_id = "b84a5d8b-c080-4d7e-b9f8-c83af3ed6304"

[env.preview.vars]
PUBLIC_SITE_URL = ""
COOKIE_DOMAIN = ""
AWS_REGION = "us-east-1"
EMAIL_FROM = "Finnoybu.com <hello@finnoybu.com>"
GOOGLE_CLIENT_ID = "753668982308-i3cvsardb34qcgkqau174uskn4aoqkn5.apps.googleusercontent.com"
FACEBOOK_CLIENT_ID = "4365482573696462"
APPLE_CLIENT_ID = "finnoybu-com"
GITHUB_CLIENT_ID = "Ov23li4nADGWGLvpGzKO"
